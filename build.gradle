plugins {
    id 'java-library'
}

// 根项目通用配置
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

subprojects {
    apply plugin: 'java-library'
    
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// 根项目不需要发布
tasks.named('jar', Jar) {
    enabled = false
}
